# 300명 동시 접속 부하 테스트 (직접 눌러서 실행)
# 저장소 Settings > Secrets and variables > Actions 에 아래 4개가 있어야 합니다.
#   SUPABASE_URL, SUPABASE_ANON_KEY, LOADTEST_EMAIL, LOADTEST_PASSWORD
# 실행: Actions 탭 > Load test > Run workflow
name: Load test

on:
  workflow_dispatch:
    inputs:
      users:
        description: "가상 학생 수"
        default: "300"
      minutes:
        description: "테스트 시간(분, 최대 50)"
        default: "10"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run load test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOADTEST_EMAIL: ${{ secrets.LOADTEST_EMAIL }}
          LOADTEST_PASSWORD: ${{ secrets.LOADTEST_PASSWORD }}
          USERS: ${{ inputs.users }}
          MINUTES: ${{ inputs.minutes }}
        run: node scripts/loadtest.mjs
